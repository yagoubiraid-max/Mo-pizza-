<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم الطلبات</title>
<style>
body {
  background: #111;
  color: #d4af37;
  font-family: Arial;
  text-align: center;
  padding: 20px;
}
.box {
  background: #222;
  padding: 20px;
  margin: 20px auto;
  border-radius: 12px;
  max-width: 500px;
}
input, button {
  padding: 12px;
  margin: 8px;
}
</style>
</head>
<body>
<h1>لوحة تحكم الطلبات</h1>
<div class="box">
  <h3>تسجيل الدخول</h3>
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <p id="message"></p>
</div>
<script>
function login() {
  document.getElementById("message").textContent =
  "سنكمل ربط قاعدة البيانات في الخطوة التالية.";
}
</script>
</body>
</html>
