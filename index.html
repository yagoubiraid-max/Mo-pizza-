<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BARAKAT SOCIAL</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f2f5;font-family:Arial,sans-serif;color:#222}
header{background:#1877f2;color:white;padding:14px;position:sticky;top:0;z-index:5}
.top{max-width:700px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-size:21px;font-weight:bold}
.container{max-width:600px;margin:18px auto;padding:0 10px}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:15px;box-shadow:0 1px 4px #ddd}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:7px 0;font-size:15px}
textarea{resize:vertical}
button{border:0;border-radius:8px;padding:11px 15px;cursor:pointer;font-size:15px}
.blue{background:#1877f2;color:white}
.gray{background:#e4e6eb;color:#222}
.full{width:100%;margin-top:8px}
.post-head{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:22px}
.post-img{width:100%;max-height:450px;object-fit:contain;margin-top:12px;border-radius:8px}
.actions{display:flex;gap:8px;margin-top:12px;border-top:1px solid #eee;padding-top:10px}
.actions button{flex:1}
.muted{color:#777;font-size:13px}
#feed:empty:after{content:"لا توجد منشورات حتى الآن. كن أول من ينشر! 🌟";display:block;background:white;padding:20px;border-radius:10px}
.hidden{display:none}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">🌐 BARAKAT SOCIAL</div>
    <button class="gray" id="logoutBtn" hidden>خروج</button>
  </div>
</header>

<main class="container">

  <section class="card" id="authBox">
    <h2>أهلًا بك في BARAKAT SOCIAL ❤️</h2>
    <p>أنشئ حسابًا وابدأ التواصل مع الآخرين.</p>

    <input id="displayName" placeholder="اسمك الكامل">
    <input id="email" type="email" placeholder="البريد الإلكتروني">
    <input id="password" type="password" placeholder="كلمة المرور">

    <button class="blue full" id="registerBtn">إنشاء حساب جديد</button>
    <button class="gray full" id="loginBtn">تسجيل الدخول</button>

    <p id="authMessage" class="muted"></p>
  </section>

  <section id="appBox" class="hidden">

    <section class="card">
      <h3 id="welcome">مرحبًا بك!</h3>
      <p>ماذا تريد أن تشارك اليوم؟</p>

      <textarea id="postText" rows="3" placeholder="اكتب منشورك هنا..."></textarea>

      <label for="postImage">📸 اختر صورة من هاتفك (اختياري)</label>
      <input id="postImage" type="file" accept="image/*">

      <button class="blue full" id="publishBtn">نشر المنشور</button>
      <p id="postMessage" class="muted"></p>
    </section>

    <h3>📰 آخر المنشورات</h3>
    <div id="feed"></div>

  </section>

</main>

<footer>BARAKAT SOCIAL © 2026</footer>

<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
