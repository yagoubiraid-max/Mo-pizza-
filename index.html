<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAÏD EXPRESS | توصيل الطعام</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}
header{
  background:#111827;
  color:white;
  padding:25px 15px;
  text-align:center;
}
.logo{font-size:30px;font-weight:bold;color:#ffb703}
header p{margin-bottom:0}
nav{
  background:#ffb703;
  padding:12px;
  text-align:center;
}
nav a{
  color:#111;
  text-decoration:none;
  font-weight:bold;
  margin:0 10px;
}
.hero{
  padding:35px 15px;
  text-align:center;
  background:linear-gradient(135deg,#111827,#374151);
  color:white;
}
.hero h1{font-size:27px}
.btn{
  display:inline-block;
  background:#ffb703;
  color:#111;
  padding:13px 22px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  border:0;
  cursor:pointer;
}
section{padding:22px 15px;max-width:1000px;margin:auto}
h2{text-align:center}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:15px;
}
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 12px #0001;
  padding-bottom:15px;
  text-align:center;
}
.card img{
  width:100%;
  height:160px;
  object-fit:cover;
}
.card h3{margin:12px}
.price{color:#e76f00;font-weight:bold}
.card button{margin:5px}
form{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 12px #0001;
}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0 14px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}
label{font-weight:bold}
footer{
  text-align:center;
  padding:25px;
  background:#111827;
  color:white;
  margin-top:30px;
}
#notice{
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  display:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">🚚 RAÏD EXPRESS</div>
  <p>خدمة توصيل الطعام في قسنطينة</p>
</header>

<nav>
  <a href="#home">الرئيسية</a>
  <a href="#restaurants">الوجبات</a>
  <a href="#order">اطلب الآن</a>
</nav>

<div class="hero" id="home">
  <h1>جوعان؟ RAÏD EXPRESS يوصلك! 🍔</h1>
  <p>اطلب من مطعمك المفضل ودع التوصيل علينا.</p>
  <p>📍 نخدمو قسنطينة والمناطق المتاحة للتوصيل</p>
  <a href="#restaurants" class="btn">شاهد الوجبات</a>
</div>
