<script>
const SUPABASE_URL = "https://glpfxexmavtpiucikzfk.supabase.co";

// ضع هنا مفتاح Publishable الخاص بمشروعك في Supabase
const SUPABASE_KEY = "ضع_مفتاح_Publishable_هنا";

const form = document.getElementById("bookingForm");

if (form) {
  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const data = {
      first_name: document.getElementById("firstName").value.trim(),
      last_name: document.getElementById("lastName").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      request_type: document.getElementById("requestType").value,
      hotel_name: document.getElementById("hotelName")?.value.trim() || "",
      notes: document.getElementById("notes")?.value.trim() || ""
    };

    if (!data.first_name || !data.last_name ||
        !data.phone || !data.request_type) {
      alert("يرجى ملء الاسم واللقب والهاتف ونوع الطلب.");
      return;
    }

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/xnas_requests`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Prefer": "return=minimal"
          },
          body: JSON.stringify(data)
        }
      );

      if (!response.ok) {
        const error = await response.text();
        console.error(error);
        alert("لم يُحفظ الطلب. تحقق من المفتاح وصلاحيات الجدول.");
        return;
      }

      alert("تم إرسال طلبك بنجاح!");
      form.reset();

    } catch (error) {
      console.error(error);
      alert("تعذر الاتصال. حاول مرة أخرى.");
    }
  });
}
</script>
