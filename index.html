  line-height: 1.8;
}

header {
  background: #080808;
  border-bottom: 2px solid #d6b35a;
  padding: 15px;
  text-align: center;

  color: #ddd;
}

.hotel-image {
  width: 100%;
  height: 190px;
  object-fit: cover;
  border-radius: 8px;
}

  padding: 22px;
  border: 1px solid #66552e;
  border-radius: 10px;
  max-width: 650px;
  margin: auto;
}

  display: block;
  margin-top: 12px;
  color: #e5c16a;
}
