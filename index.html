<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAÏD EXPRESS | توصيل الطعام</title>

<style>
:root {
  --main: #e63946;
  --dark: #17202a;
  --yellow: #ffbe0b;
  --bg: #f5f6fa;
  --white: #fff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Tahoma, sans-serif;
  background: var(--bg);
  color: #222;
}

header {
  background: var(--dark);
  color: white;
  padding: 20px 12px;
  text-align: center;
}

.logo {
  color: var(--yellow);
  font-size: 29px;
  font-weight: bold;
}

header p {
  margin-bottom: 0;
}

nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  padding: 14px;
  background: var(--yellow);
}

nav a {
  text-decoration: none;
  color: #111;
  font-weight: bold;
}

.hero {
  padding: 45px 15px;
  background: linear-gradient(135deg, #17202a, #5b2333);
  text-align: center;
  color: white;
}

.hero h1 {
  font-size: 30px;
}

.hero p {
  line-height: 1.8;
}

.button {
  background: var(--main);
  color: white;
  padding: 12px 18px;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  font-weight: bold;
  font-size: 15px;
  display: inline-block;
  text-decoration: none;
}

.button:hover {
  opacity: .9;
}

section {
  max-width: 1150px;
  margin: auto;
  padding: 25px 14px;
}

h2 {
  text-align: center;
  margin-bottom: 22px;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  justify-content: center;
  margin-bottom: 22px;
}

.category {
  background: white;
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 10px 15px;
  cursor: pointer;
  font-size: 15px;
}

.category.active {
  background: var(--main);
  color: white;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  border-radius: 13px;
  overflow: hidden;
  box-shadow: 0 3px 12px #0000000d;
}

.card img {
  width: 100%;
  height: 165px;
  object-fit: cover;
  display: block;
}

.card-content {
  padding: 13px;
}

.card h3 {
  margin: 5px 0 8px;
}

.description {
  color: #666;
  font-size: 14px;
  min-height: 36px;
}

.price {
  color: var(--main);
  font-size: 19px;
  font-weight: bold;
}

.card .button {
  width: 100%;
}
